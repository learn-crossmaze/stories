<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Stories — subscribe once, borrow within your plan, exchange books as often as you like.">
  <meta name="theme-color" content="#FBF7F0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stories">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Stories</title>
  <style>
    html, body { margin: 0; height: 100%; background: #FBF7F0; }
    @media (prefers-color-scheme: dark) { html, body { background: #12181B; } #splash { color: #EDE6DA; } }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 8px;
      font-family: Georgia, 'Times New Roman', serif; color: #1E2A2F;
    }
    #splash h1 { margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.5px; }
    #splash p { margin: 0; font-style: italic; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <h1>Stories</h1>
    <p>Every book begins a new story.</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
