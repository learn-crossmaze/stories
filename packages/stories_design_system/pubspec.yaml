name: stories_design_system
description: Stories design tokens, theme and shared components.
publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  fonts:
    - family: Fraunces
      fonts:
        - asset: fonts/Fraunces_600SemiBold.ttf
          weight: 600
        - asset: fonts/Fraunces_700Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: fonts/Inter_400Regular.ttf
          weight: 400
        - asset: fonts/Inter_500Medium.ttf
          weight: 500
        - asset: fonts/Inter_600SemiBold.ttf
          weight: 600
        - asset: fonts/Inter_700Bold.ttf
          weight: 700
